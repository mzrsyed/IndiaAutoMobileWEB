<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>India Automobiles</title>
    <script>
      // Cleanly redirect any 404 path back to the application base
      var repoBase = window.location.pathname.split('/').slice(0, 2).join('/') + '/';
      window.location.replace(repoBase);
    </script>
  </head>
  <body>
    <p>Redirecting to India Automobiles...</p>
  </body>
</html>
